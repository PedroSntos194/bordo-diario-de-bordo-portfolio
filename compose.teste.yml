# Exclusivo dos testes HTTP. Não usa .env, storage ou volumes de produção.
name: bordo-testes-http
services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bordo_ci
      POSTGRES_PASSWORD: bordo_ci_apenas_testes
      POSTGRES_DB: bordo_ci
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bordo_ci -d bordo_ci']
      interval: 2s
      timeout: 3s
      retries: 30
